name: Publicar USCA Vale na Locaweb (SSH seguro)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Somente preparar e validar (sem upload)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: usca-vale-locaweb
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar arquivos via SSH/SCP
    if: ${{ vars.LOCAWEB_DEPLOY_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo-fonte
        uses: actions/checkout@v4

      - name: Validar credenciais e raiz publica
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          FTP_DIR: public_html/
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::Configure os tres Secrets LOCAWEB_FTP_HOST, LOCAWEB_FTP_USER e LOCAWEB_FTP_PASSWORD."
            exit 1
          fi
          if [[ ! "$FTP_DIR" =~ ^[a-zA-Z0-9_./-]+/$ || "$FTP_DIR" == /* || "$FTP_DIR" == *..* || "$FTP_DIR" == *//* ]]; then
            echo "::error::Caminho remoto invalido."
            exit 1
          fi
          if [[ "$FTP_DIR" != "public_html/" ]]; then
            echo "::error::Destino diferente de public_html/; revisao manual obrigatoria."
            exit 1
          fi
          echo "Destino configurado: public_html/ (raiz publica do site). Sem limpeza de arquivos remotos."

      - name: Preparar somente os arquivos publicos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/assets deploy/src deploy/sql
          cp index.php api.php login.php logout.php install.php .htaccess deploy/
          cp -R assets/. deploy/assets/
          cp -R src/. deploy/src/
          cp sql/schema.sql sql/.htaccess deploy/sql/
          test -f deploy/index.php
          test -f deploy/assets/visual-dashboard.js
          test -f deploy/.htaccess
          test -f deploy/src/bootstrap.php
          if [[ -f deploy/config.php || -d deploy/var || -d deploy/backups || -d deploy/bin ]]; then
            echo "::error::Arquivo privado no pacote."
            exit 1
          fi
          echo "Pacote verificado. Sem config.php, backups, var ou coletor."

      - name: Verificar sintaxe e tooltip antes do envio
        shell: bash
        run: |
          set -euo pipefail
          for js in assets/chart-series.js assets/chart-hover.js assets/app.js assets/visual-dashboard.js; do
            node --check "$js"
          done
          node tests/chart_hover_contract.cjs
          node tests/chart_series_contract.cjs
          node tests/dashboard_phase_contract.cjs
          if command -v php >/dev/null 2>&1; then
            php -l index.php
            php -l api.php
            php -l install.php
            php tests/installer_contract.php
          else
            echo "::error::PHP nao disponivel para validar o instalador."
            exit 1
          fi

      - name: Publicar com SSH/SCP (porta 22, host key fixada)
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          FTP_DIR: public_html/
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 8 -t ed25519 -p 22 "$FTP_HOST" 2>/dev/null > /tmp/locaweb_known_hosts
          test -s /tmp/locaweb_known_hosts
          fingerprint="$(ssh-keygen -lf /tmp/locaweb_known_hosts -E sha256 | awk '{print $2}')"
          if [[ "$fingerprint" != "SHA256:PECk31ESSziOS6VSdwooBFs9djNEEUKy6wUBbpPok50" ]]; then
            echo "::error::Host SSH nao corresponde a identidade previamente observada. Upload cancelado."
            exit 1
          fi
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$FTP_PASSWORD"
          SSH_OPTS=(-oStrictHostKeyChecking=yes -oUserKnownHostsFile=/tmp/locaweb_known_hosts -oPubkeyAuthentication=no -oPreferredAuthentications=password,keyboard-interactive -oNumberOfPasswordPrompts=1 -oConnectTimeout=10)
          # A pasta home da conta nao e o document root. SSH e SFTP possuem views diferentes.
          # Conferir o destino e REJEITAR colisoes antes de publicar na raiz.
          audit_log="$(mktemp)"
          {
            echo 'cd public_html'
            echo pwd
            echo 'ls -1a'
            echo bye
          } | timeout 40 sshpass -e sftp "${SSH_OPTS[@]}" -P 22 "$FTP_USER@$FTP_HOST" 2>&1 | tee "$audit_log"
          if ! grep -q '/public_html' "$audit_log"; then
            echo '::error::Raiz publica public_html/ nao foi confirmada. Upload cancelado.'
            exit 1
          fi
          if grep -Eiq '^(index[.]php|[.]htaccess|api[.]php|login[.]php|logout[.]php|install[.]php|assets|src|sql)[[:space:]]*$' "$audit_log"; then
            echo 'Arquivos existentes encontrados; verificando se a raiz ja pertence ao USCA Vale.'
            check_dir="$(mktemp -d)"
            {
              echo "get public_html/index.php $check_dir/index.php"
              echo "get public_html/api.php $check_dir/api.php"
              echo "get public_html/.htaccess $check_dir/.htaccess"
              echo bye
            } | timeout 45 sshpass -e sftp "${SSH_OPTS[@]}" -P 22 "$FTP_USER@$FTP_HOST"
            if [[ ! -s "$check_dir/index.php" || ! -s "$check_dir/api.php" || ! -s "$check_dir/.htaccess" ]]; then
              echo '::error::Arquivos preexistentes nao puderam ser identificados. Upload cancelado.'
              exit 1
            fi
            if ! grep -q 'USCA Vale | Centro de Monitoramento' "$check_dir/index.php" ||
               ! grep -q 'src/bootstrap.php' "$check_dir/index.php" ||
               ! grep -q 'requireAuth();' "$check_dir/api.php" ||
               ! grep -Fq 'Require all denied' "$check_dir/.htaccess"; then
              echo '::error::A raiz contem uma aplicacao diferente do USCA Vale. Upload cancelado para evitar sobrescrever outro site.'
              exit 1
            fi
            echo 'Aplicacao USCA Vale ja existente na raiz, atualizacao permitida sem apagar outras pastas.'
          fi
          echo 'Auditoria da raiz concluida. Iniciando transferencia...'
          timeout 180 sshpass -e scp -r "${SSH_OPTS[@]}" -P 22 ./deploy/. "$FTP_USER@$FTP_HOST:$FTP_DIR"
          # Baixe amostras do destino e compare byte a byte: o shell SSH e restrito.
          verify_dir="$(mktemp -d)"
          {
            echo "get public_html/index.php $verify_dir/index.php"
            echo "get public_html/.htaccess $verify_dir/.htaccess"
            echo "get public_html/assets/visual-dashboard.js $verify_dir/visual-dashboard.js"
            echo bye
          } | timeout 40 sshpass -e sftp "${SSH_OPTS[@]}" -P 22 "$FTP_USER@$FTP_HOST"
          test -s "$verify_dir/index.php"
          test -s "$verify_dir/.htaccess"
          test -s "$verify_dir/visual-dashboard.js"
          cmp -s deploy/index.php "$verify_dir/index.php"
          cmp -s deploy/.htaccess "$verify_dir/.htaccess"
          cmp -s deploy/assets/visual-dashboard.js "$verify_dir/visual-dashboard.js"
          echo 'PUBLICADO E VERIFICADO: public_html/ (3 arquivos comparados byte a byte).'
          echo 'O banco de dados e coletor Modbus continuam fora do deploy.'

      - name: Resumo do modo simulacao de deploy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: echo "Simulacao concluida sem alterar a hospedagem."
