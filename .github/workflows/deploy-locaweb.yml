name: Publicar USCA Vale na Locaweb (FTPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem enviar arquivos (desmarque para publicar)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: usca-vale-locaweb
  cancel-in-progress: false

jobs:
  deploy:
    name: Enviar somente arquivos publicaveis
    if: ${{ vars.LOCAWEB_DEPLOY_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obter codigo do GitHub
        uses: actions/checkout@v4

      - name: Validar configuracao e pasta de destino
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          FTP_DIR: ${{ vars.LOCAWEB_FTP_DIR || 'public_html/usca_vale/' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USER" || -z "$FTP_PASSWORD" ]]; then
            echo "::error::Cadastre LOCAWEB_FTP_HOST, LOCAWEB_FTP_USER e LOCAWEB_FTP_PASSWORD em Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi
          if [[ -z "$FTP_DIR" || "$FTP_DIR" == /* || "$FTP_DIR" == *..* || "$FTP_DIR" == *//* || "$FTP_DIR" == *[[:space:]]* || "$FTP_DIR" != */ ]]; then
            echo "::error::LOCAWEB_FTP_DIR deve ser um caminho relativo, sem .., sem espacos e terminado em /. Ex.: public_html/usca_vale/."
            exit 1
          fi
          case "$FTP_DIR" in
            usca_vale/|*/usca_vale/) ;;
            *) echo "::error::Por seguranca o destino deve ser uma pasta exclusiva usca_vale/, nunca a raiz de outros sites."; exit 1 ;;
          esac

      - name: Montar pacote PHP publico (sem banco, backups ou credenciais)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy/assets deploy/src deploy/sql
          cp index.php api.php login.php logout.php install.php .htaccess deploy/
          cp -R assets/. deploy/assets/
          cp -R src/. deploy/src/
          cp sql/schema.sql sql/.htaccess deploy/sql/
          test -f deploy/index.php
          test -f deploy/src/bootstrap.php
          test -f deploy/assets/visual-dashboard.js
          test -f deploy/sql/schema.sql
          if [[ -e deploy/config.php || -d deploy/backups || -d deploy/var || -d deploy/bin ]]; then
            echo "::error::O pacote contem arquivos privados."
            exit 1
          fi
          echo "Pacote publico preparado (sem config.php, logs, backups, testes ou coletor)."

      - name: Verificar disponibilidade SSH/SFTP sem usar credenciais
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          if timeout 6 bash -c 'echo > /dev/tcp/"$1"/22' -- "$FTP_HOST" 2>/dev/null; then
            echo "Porta TCP 22 aberta; avaliar habilitacao SSH e validar chave do servidor antes de autenticar."
          else
            echo "Porta TCP 22 indisponivel para este servidor. Habilite SSH no painel da hospedagem se suportado."
          fi

      - name: Identificar chave publica SSH (sem autenticar)
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 5 -p 22 "$FTP_HOST" 2>/dev/null | grep -E ' ssh-(rsa|ed25519) | ecdsa-' > /tmp/locaweb_hostkeys || true
          if [[ -s /tmp/locaweb_hostkeys ]]; then
            echo "Chave SSH publica identificada (fingerprint SHA256):"
            ssh-keygen -lf /tmp/locaweb_hostkeys -E sha256 | sed -E 's/^([0-9]+) (SHA256:[A-Za-z0-9+\/]+=*).*/\1 \2/'
          else
            echo "Nenhuma chave SSH obtida; acesso SFTP ainda nao demonstrado."
          fi

      - name: Testar login SFTP criptografado (sem alterar arquivos)
        env:
          FTP_HOST: ${{ secrets.LOCAWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.LOCAWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          ssh-keyscan -T 7 -p 22 -t ed25519 "$FTP_HOST" 2>/dev/null > /tmp/locaweb_known_hosts
          test -s /tmp/locaweb_known_hosts
          fingerprint="$(ssh-keygen -lf /tmp/locaweb_known_hosts -E sha256 | awk '{print $2}')"
          if [[ "$fingerprint" != "SHA256:PECk31ESSziOS6VSdwooBFs9djNEEUKy6wUBbpPok50" ]]; then
            echo "::error::A identidade SSH do host mudou; interrompendo por seguranca."
            exit 1
          fi
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq sshpass >/dev/null
          export SSHPASS="$FTP_PASSWORD"
          { echo pwd; echo 'ls -ld public_html'; echo bye; } | timeout 20 sshpass -e sftp -oStrictHostKeyChecking=yes -oUserKnownHostsFile=/tmp/locaweb_known_hosts -oPubkeyAuthentication=no -oPreferredAuthentications=password,keyboard-interactive -oNumberOfPasswordPrompts=1 -P 22 "$FTP_USER@$FTP_HOST"
          echo "Verificando via SSH a pasta de publicacao:"
          timeout 20 sshpass -e ssh -oStrictHostKeyChecking=yes -oUserKnownHostsFile=/tmp/locaweb_known_hosts -oPubkeyAuthentication=no -oPreferredAuthentications=password,keyboard-interactive -oNumberOfPasswordPrompts=1 -oConnectTimeout=8 -p 22 "$FTP_USER@$FTP_HOST" 'test -d public_html && printf "Pasta public_html existente\\n"'
          echo "Login SFTP seguro verificado (nenhum upload realizado)."

      - name: Enviar arquivos por FTPS (TLS obrigatorio)
        if: false # FTPS rejeitado pelo servidor (500 AUTH); nunca reenviar senha via FTP plano
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.LOCAWEB_FTP_HOST }}
          username: ${{ secrets.LOCAWEB_FTP_USER }}
          password: ${{ secrets.LOCAWEB_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ${{ vars.LOCAWEB_FTP_DIR || 'public_html/usca_vale/' }}
          dangerous-clean-slate: false
          dry-run: true
          log-level: standard
